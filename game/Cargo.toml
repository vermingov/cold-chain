[package]
name = "cold-chain"
version = "0.9.0"
edition = "2024"

[dependencies]
# Bevy's defaults, JPEG (the people's skins and clothes, the surfaces, the props' maps) and WebP (the weapons' glTF
# textures: tools/gltf-fallback.py).
bevy = { version = "0.20", features = ["jpeg", "webp"] }
bevy_rapier3d = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The numbers on the hall's walls are drawn into a texture on the CPU, as the TS game drew them on a canvas.
ab_glyph = "0.2"
# Plain numbers as bytes for the GPU: the skin's paint stamps (skin.rs), the floor's and the clothes' blood (blood.rs,
# floor.rs, soak.rs).
bytemuck = { version = "1", features = ["derive"] }
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis"] }

# The game's own code with debug checks, Bevy and the physics optimised: a ragdoll stepped at 120 Hz in a debug build
# of Rapier is unplayably slow. No debug info: it is most of the build's size on a disk with a few gigabytes free.
[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3

# The game as shipped (`cargo build --release`): Cargo's release profile as it is, everything at opt-level 3 in 16
# codegen units. Cross-crate LTO (even thin) is left off: it keeps LLVM bitcode in every dependency's library, which
# makes target/release (2.4 GB without it) more than the build machine's disk holds beside the debug builds, and every
# build of the game then optimises all of Bevy again at the link. The package's binary is stripped after the build.
