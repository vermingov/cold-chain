<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the table</title>
<style>html, body { margin: 0; height: 100%; background: #000; } canvas { width: 100%; height: 100%; display: block; outline: none; cursor: none; }</style>
</head>
<body>
<canvas id="view"></canvas>
<script type="module">
import * as BABYLON from '@babylonjs/core';
Object.assign(window, { BABYLON });     // for the rig's scripts
// A body on the table and a scalpel in the hand.
//   ?view=work | far | close | low | top | near    where the eye is
//   ?skin=0                                    without the skin, to see what is inside and where
// 1 is the scalpel: move the mouse over the trunk, hold the button and draw to cut. Slow is deep.
// 2 is the bare hand: draw the lip of a wound that goes through to pull it open; take hold of what is inside.
import { buildTable } from '../src/table/room.ts';

const query = new URLSearchParams(location.search);
const canvas = document.getElementById('view');
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
const V3 = BABYLON.Vector3;
const table = await buildTable(scene, canvas, { base: '../', view: query.get('view') });
const { camera, field, flesh, lining, dead, hands } = table;
if (query.get('skin') === '0') for (const mesh of [dead.mesh, ...flesh.meshes, lining]) mesh.setEnabled(false);

// For the rig, which has no hand: draw whatever tool is in use through these
// places on the field (each [u, v]) in so many seconds, as a hand would, and
// say when done.
function draw(places, seconds) {
    // A place is [u, v] on the skin, or [x, y, z] in the room.
    const onScreen = (place) => {
        const p = V3.Project(place.length === 3 ? V3.FromArray(place) : field.point(...place), BABYLON.Matrix.Identity(), scene.getTransformMatrix(),
            camera.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight()));
        return [p.x, p.y];
    };
    const lengths = places.slice(1).map((p, i) => Math.hypot(...p.map((to, k) => to - places[i][k])));
    const whole = lengths.reduce((a, b) => a + b, 0);
    return new Promise((done) => {
        let spent = -0.2;       // a moment over the skin before going in
        const hand = scene.onBeforeRenderObservable.add(() => {
            spent += engine.getDeltaTime() / 1000;
            let gone = Math.max(0, Math.min(1, spent / seconds)) * whole, leg = 0;
            while (leg < lengths.length - 1 && gone > lengths[leg]) gone -= lengths[leg++];
            const t = lengths[leg] ? gone / lengths[leg] : 0;
            hands.tool.aim(...onScreen(places[leg].map((from, k) => from + (places[leg + 1][k] - from) * t)));
            if (spent >= 0) hands.tool.press(true);
            if (spent >= seconds + 0.1) {
                hands.tool.press(false);
                scene.onBeforeRenderObservable.remove(hand);
                done(true);
            }
        });
    });
}

window.__table = { ...table, engine, draw };
engine.runRenderLoop(() => {
    table.update(Math.min(0.05, engine.getDeltaTime() / 1000));
    scene.render();
});
window.addEventListener('resize', () => engine.resize());
</script>
</body>
</html>
