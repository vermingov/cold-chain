<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>the yard</title>
<style>html, body { margin: 0; height: 100%; background: #000; } canvas { width: 100%; height: 100%; display: block; outline: none; }</style>
</head>
<body>
<canvas id="view"></canvas>
<script src="../vendor/babylon.js"></script>
<script type="module">
// The cemetery, to walk about in with a torch.
//   ?view=gate | avenue | old | lawn | public | chapel | front | lodge | ...   where the player starts (VIEWS)
//   ?torch=0                                                             without the torch
//   ?day=1                                                               a dull afternoon, for judging materials
// Click to take the mouse; W A S D to walk, Shift to run, Ctrl or C to get down.
import { Surfaces } from '../src/surfaces.js';
import { Models } from '../src/models.js';
import { Player } from '../src/player.js';
import { gradePicture } from '../src/picture.js';
import { Night } from '../src/yard/night.js';
import { Torch } from '../src/yard/torch.js';
import { buildYard } from '../src/yard/yard.js';
import { heightAt } from '../src/map/plan.js';

const query = new URLSearchParams(location.search);
const canvas = document.getElementById('view');
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);

// Each: where from, looking at where, how high the eye is, how high the thing looked at.
const VIEWS = {
    gate: [[1.5, -9], [0, 14]],
    avenue: [[0.4, 6], [0, 60]],
    old: [[-9, 22], [-30, 27]],
    lawn: [[-10, 50], [-34, 74]],
    public: [[14, 98.5], [34, 114]],
    meadow: [[-12, 99], [-34, 116]],
    chapel: [[1.5, 46], [0, 70]],
    front: [[2.5, 57], [0, 66], 1.65, 3.2],
    side: [[-13, 62], [-4, 72], 1.65, 2.6],
    cold: [[16, 86], [4.5, 76.5]],
    lodge: [[1.2, 3], [-8, 9]],
    back: [[0, 30], [0, 0]],
    lych: [[-47, 41], [-56, 40]],
    service: [[50, 94], [56, 96]],
    name: [[-20.6, 52.4], [-22.2, 52.4], 0.95, 0.42],
    names: [[-19.4, 54.4], [-22.2, 52.4], 1.4, 0.4],
    number: [[13.0, 104.7], [12.17, 104.4], 0.6, 0.36],
    turf: [[-30, 24], [-33, 28], 0.9, 0.2],
    high: [[-70, -30], [0, 70], 45, 0],
};
const [[fx, fz], [tx, tz], eye = 1.65, aimAt = 1.3] = VIEWS[query.get('view')] || VIEWS.gate;

const surfaces = new Surfaces(scene, '../assets/surfaces/');
// The player is made before there is anywhere to stand, because the night
// and the torch want the camera; the yard hands over its footing below.
const player = new Player(scene, canvas, null);
const camera = player.camera;
const night = new Night(scene, camera);
const torch = new Torch(scene, camera);
torch.on = query.get('torch') !== '0';

const casts = { cast: (m) => { night.cast([m]); torch.cast([m]); }, uncast() {} };
const models = new Models(scene, casts, '../assets/props/');
const yard = await buildYard(scene, { surfaces, models, night, fonts: '../vendor/fonts/' });
torch.cast([...yard.stones, ...yard.trees, ...yard.built]);
player.place = yard.footing;
player.spawn(fx, fz, { toward: [tx, heightAt(tx, tz) + aimAt, tz], eye });

// A dull afternoon instead, for judging what things are made of.
const day = query.get('day') === '1';
if (day) {
    night.fill.intensity = 0.55;
    night.fill.groundColor = new BABYLON.Color3(0.3, 0.3, 0.3);
    night.moon.intensity = 2.4;
    night.moon.diffuse = new BABYLON.Color3(1, 0.97, 0.92);
    torch.on = false;
    scene.fogDensity = 0.003;
}
const pipeline = gradePicture(scene, camera, day ? { exposure: 1.6 } : {});

window.__yard = { scene, engine, camera, player, yard, night, torch, pipeline };
engine.runRenderLoop(() => {
    // Never more than a twentieth of a second at once: a stalled frame must
    // not carry anybody through a wall.
    player.update(Math.min(0.05, engine.getDeltaTime() / 1000));
    torch.update(yard.reach(torch.beam.position, torch.beam.direction));
    night.update();
    yard.tokens.update(performance.now() / 1000);
    scene.render();
});
window.addEventListener('resize', () => engine.resize());
</script>
</body>
</html>
