<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cold Chain</title>
<style>
@font-face { font-family: 'Fell'; src: url('vendor/fonts/im-fell-english.woff2') format('woff2'); }
@font-face { font-family: 'Fell'; font-style: italic; src: url('vendor/fonts/im-fell-english-italic.woff2') format('woff2'); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; outline: none; }
.over { position: fixed; inset: 0; pointer-events: none; font-family: 'Fell', Georgia, serif; color: #ddd7c8; }
.over > div { position: absolute; transition: opacity 0.9s; opacity: 0; }
.over > .shown { opacity: 1; }
.dark { inset: 0; background: #000; }
.card { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem; }
.card .head { font-size: 2.4rem; }
.card .line { font-size: 1.3rem; font-style: italic; color: #8f897c; }
.words { left: 50%; bottom: 9vh; transform: translateX(-50%); width: min(46rem, 80vw); text-align: center; font-size: 1.45rem; line-height: 1.4;
    text-shadow: 0 0 2px #000, 0 1px 6px #000, 0 0 18px rgba(0, 0, 0, 0.8); transition-duration: 0.25s; }
.words .who { display: block; font-style: italic; font-size: 1rem; color: #a59f90; margin-bottom: 0.15rem; }
.over > .held { left: 50%; bottom: calc(9vh - 1rem); width: 9rem; margin-left: -4.5rem; height: 2px; background: #a59f90; opacity: 1;
    transform: scaleX(0); transform-origin: left; transition: none; }
.aim { left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #ddd7c8; transition-duration: 0.15s; }
.verb { left: 50%; top: calc(50% + 1.1rem); transform: translateX(-50%); font-style: italic; font-size: 1.05rem; color: #c9c3b4;
    text-shadow: 0 0 2px #000, 0 1px 5px #000; opacity: 1; white-space: nowrap; }
.version { left: 1rem; top: 0.8rem; font-family: Georgia, serif; font-size: 0.75rem; color: #6f6a60; letter-spacing: 0.04em; }
.todo { left: 1rem; top: 2rem; max-width: 38vw; line-height: 1.35; font-style: italic; font-size: 1.1rem; color: #c9c3b4; text-shadow: 0 0 2px #000, 0 1px 5px #000; }
.over > .breath { left: 50%; bottom: 3.2rem; width: 12rem; margin-left: -6rem; height: 3px; background: #a59f90; transform-origin: center;
    transition: opacity 0.6s; box-shadow: 0 0 4px #000; }
.marker { transform: translate(-50%, -100%); font-style: italic; font-size: 1rem; color: #ddd7c8; text-shadow: 0 0 2px #000, 0 1px 5px #000;
    white-space: nowrap; transition-duration: 0.3s; }
.marker::after { content: ''; display: block; width: 1px; height: 1.4rem; margin: 0.2rem auto 0; background: #ddd7c8; box-shadow: 0 0 3px #000; }
.how { left: 1rem; top: 3.9rem; max-width: 30vw; font-size: 0.9rem; line-height: 1.4; color: #a59f90; text-shadow: 0 0 2px #000, 0 1px 5px #000; }
.fault { left: 1rem; bottom: 0.8rem; max-width: 50vw; font-family: Georgia, serif; font-size: 0.8rem; color: #b07a6a; }
.start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000;
    font-family: 'Fell', Georgia, serif; color: #ddd7c8; cursor: pointer; }
.start h1 { font-size: 4rem; font-weight: normal; margin: 0 0 1rem; }
.start p { font-style: italic; color: #8f897c; margin: 0.2rem; font-size: 1.15rem; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="over" id="over"></div>
<div class="start" id="start">
<h1>Cold Chain</h1>
<p>W A S D to walk, the mouse to look around. Shift to run, C to crouch. E to use whatever you are looking at.</p>
<p>Tab holds up your clipboard. Tap Space to skip a line of speech, or hold it to skip the whole conversation.</p>
<p>Click to start.</p>
</div>
<script type="module">
import { Screen } from './src/game/screen.ts';
import { Game } from './src/game/game.ts';
import { makeEngine } from './src/engine.ts';

const canvas = document.getElementById('view');
const engine = await makeEngine(canvas);
window.addEventListener('resize', () => engine.resize());
const game = new Game(engine, canvas, new Screen(document.getElementById('over')));
window.__game = game;
const start = document.getElementById('start');
start.addEventListener('click', () => {
    start.remove();
    canvas.requestPointerLock();
    game.play();
}, { once: true });
</script>
</body>
</html>
