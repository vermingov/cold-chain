<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cold Chain</title>
<style>
@font-face { font-family: 'Fell'; src: url('vendor/fonts/im-fell-english.woff2') format('woff2'); }
@font-face { font-family: 'Fell'; font-style: italic; src: url('vendor/fonts/im-fell-english-italic.woff2') format('woff2'); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; outline: none; }
.over { position: fixed; inset: 0; pointer-events: none; font-family: 'Fell', Georgia, serif; color: #ddd7c8;
    text-shadow: 0 0 2px #000, 0 1px 5px #000; }
.over > div { position: absolute; }
.version { left: 1rem; top: 0.8rem; font-family: Georgia, serif; font-size: 0.85rem; color: #b5ae9f; letter-spacing: 0.04em; }
.aim { left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: #ddd7c8; box-shadow: 0 0 2px #000; }
.arms { left: 50%; bottom: 1.1rem; transform: translateX(-50%); display: flex; gap: 1.3rem; font-size: 1rem; color: #8f897c; white-space: nowrap; }
.arms b { font-weight: normal; font-family: Georgia, serif; font-size: 0.8rem; color: #6f6a60; margin-right: 0.2rem; }
.arms .on { color: #f1ece0; }
.arms .on b { color: #c9c3b4; }
.ammo { right: 1.4rem; bottom: 1rem; font-family: Georgia, serif; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.monitor { right: 1.4rem; top: 1rem; width: 19rem; }
.monitor h2 { margin: 0; font-weight: normal; font-size: 1.35rem; }
.monitor .state { margin: 0.1rem 0 0.5rem; font-style: italic; font-size: 1.1rem; color: #c9c3b4; }
.monitor table { border-collapse: collapse; width: 100%; font-size: 0.98rem; }
.monitor td { padding: 0.1rem 0; }
.monitor td + td { text-align: right; font-family: Georgia, serif; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.monitor ul { margin: 0.7rem 0 0; padding: 0; list-style: none; font-size: 0.95rem; line-height: 1.35; color: #c9c3b4; }
.monitor .warn, .monitor .warn td { color: #e08a74; }
.help { left: 1rem; bottom: 1rem; max-width: 34rem; font-size: 0.9rem; line-height: 1.35; color: #a59f90; }
.help p { margin: 0; }
.help.gone { display: none; }
.fault { left: 1rem; top: 2.2rem; max-width: 50vw; font-family: Georgia, serif; font-size: 0.8rem; color: #b07a6a; }
.start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000;
    font-family: 'Fell', Georgia, serif; color: #ddd7c8; cursor: pointer; }
.start h1 { font-size: 4rem; font-weight: normal; margin: 0 0 1rem; }
.start p { font-style: italic; color: #8f897c; margin: 0.2rem; font-size: 1.15rem; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="over" id="over"></div>
<div class="start" id="start">
<h1>Cold Chain</h1>
<p id="loading">Loading the hall and the people in it.</p>
</div>
<script type="module">
import { makeEngine } from './src/engine.ts';
import { Hud } from './src/sandbox/hud.ts';
import { openSandbox } from './src/sandbox/sandbox.ts';

const canvas = document.getElementById('view');
const engine = await makeEngine(canvas);
window.addEventListener('resize', () => engine.resize());
const hud = new Hud(document.getElementById('over'));
window.addEventListener('error', (e) => hud.error(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => hud.error(e.reason));
const sandbox = await openSandbox(engine, canvas, hud);
window.__sandbox = sandbox;
engine.runRenderLoop(() => {
    try {
        sandbox.update(Math.min(0.05, engine.getDeltaTime() / 1000));
        sandbox.scene.render();
    } catch (error) {
        hud.error(error);
    }
});
const start = document.getElementById('start');
document.getElementById('loading').textContent = 'Click to start.';
start.addEventListener('click', () => {
    start.remove();
    canvas.requestPointerLock();
    sandbox.world.start();
}, { once: true });
</script>
</body>
</html>
